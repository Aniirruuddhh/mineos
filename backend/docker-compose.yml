services:
  postgres:
    image: postgres:16
    container_name: mineos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mineos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: anirudh9123_
    ports:
      - "5432:5432"
    volumes:
      - mineos_pgdata:/var/lib/postgresql/data

volumes:
  mineos_pgdata:
